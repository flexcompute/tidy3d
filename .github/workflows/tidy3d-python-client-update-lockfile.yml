name: public/tidy3d/python-client-update-lockfile

on:
  workflow_dispatch:
    inputs:
      run-workflow:
        description: 'Set to true to update the lock file and create a PR'
        required: true
        type: boolean
        default: true

  workflow_call:
    inputs:
      run-workflow:
        description: 'Set to true to update the lock file and create a PR'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  update-lockfile:
    if: github.event.inputs.run-workflow || inputs.run-workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c #v6.0.0
        with:
          python-version: '3.10'
      
      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a  # v1.4.1
        with:
          version: 2.1.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Update lock file
        run: |
          set -e
          poetry update --lock

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e #v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): :robot: Daily update `poetry.lock`"
          title: "chore(deps): :robot: Daily update `poetry.lock`"
          body: |
            This pull request was automatically generated by a GitHub Action.

            It updates the `poetry.lock` file to reflect changes in the pip state, and whether the package is broken by external dependency changes.
          branch: "daily-chore/update-poetry-lock"
          base: "develop"
          delete-branch: true
