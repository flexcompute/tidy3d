          base_version="${BASE_VERSION}"
          base_ref="${BASE_REF}"
          if [[ "$base_version" == *rc* ]] || [[ "$base_version" == *dev* ]]; then
            echo "✅ Passing: Schema changed on a pre-release version ($base_version) in base branch '${base_ref}', which is permitted."
