name: public/tidy3d/python-client-daily-run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Runs at 5am UTC

permissions:
  contents: read

jobs:
  update-lockfile:
    uses: ./.github/workflows/public_tidy3d-python-client-update-lockfile.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      run-workflow: true
