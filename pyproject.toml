extras = ["tidy3d-extras==2.12.0"]

[project.scripts]
tidy3d = "tidy3d.web.cli:tidy3d_cli"

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "codeartifact"
url = "https://flexcompute-625554095313.d.codeartifact.us-east-1.amazonaws.com/pypi/pypi-releases/simple/"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pypi", marker = "sys_platform == 'darwin'" },
  { index = "torch-cpu", marker = "sys_platform != 'darwin'" },
]
tidy3d-extras = { index = "codeartifact" }

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
template = "changelog.d/template.md"
title_format = "## [{version}] - {project_date}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "planned_deprecation"
name = "Planned Deprecation"
showcontent = true

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tidy3d"]

[tool.hatch.build.targets.wheel.force-include]
"tidy3d/style.mplstyle" = "tidy3d/style.mplstyle"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/faq/"]

[tool.ruff.lint]
extend-select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "B",      # bugbear
  "I",      # isort
  "UP",     # pyupgrade
  "W",      # pycodestyle
  "C4",     # flake8-comprehensions
  "NPY",    # numpy-specific rules
  "RUF",    # ruff builtins
  "ISC",    # implicit string concatenation
  "PIE",    # flake8-pie
  "RSE",    # unnecessary parantheses on raised exceptions
  "TID",    # no relative imports from parent modules
  "PLE",    # pylint errors
  "PLC",    # pylint conventions
]
extend-ignore = [
  "RUF001",   # ambiguous unicode characters
  "RUF002",   # ambiguous unicode characters
  "RUF003",   # ambiguous unicode characters
  "RUF012",   # type hints for mutable defaults
  "RUF015",   # next(iter(...)) instead of list(...)[0]
  "E501",     # line too long
  "B905",     # `zip()` without an explicit `strict=` parameter
  "NPY002",   # TODO: Revisit RNG handling
  "PLC0415",  # allow imports not at top level
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["scipy", "matplotlib"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "B015",   # useless comparison
    "B018",   # useless expression
    "E402",   # module-level import not at top of file
    "E731",   # lambda assignment
    "F841",   # unused local variable
    "S101",   # asserts allowed in tests
    "NPY201", # numpy 2.* compatibility check
    "TID252", # allow relative imports in tests
    "TID253", # allow heavy imports in tests
]
"tidy3d/plugins/**/*" = [
    "TID253", # allow heavy imports in plugins (not used by MC)
]

[tool.pytest.ini_options]
addopts = """
--cov=tidy3d --doctest-modules -n auto --dist worksteal -m 'not numerical and not perf and not generate_profile and not performance_profile'
"""
markers = [
  "numerical: marks numerical tests for adjoint gradients that require running simulations (deselect with '-m \"not numerical\"')",
  "generate_profile: regenerate fixture data required by the performance tests (select with '-m \"generate_profile\"')",
  "performance_profile: enable CPU and memory profiling based on data generated with generate_profile (select with '-m \"performance_profile\"')",
  "perf: marks tests which test the runtime of operations (deselect with '-m \"not perf\"')",
  "slow: marks tests as slow (deselect with -m 'not slow')",
]
env = ["MPLBACKEND=Agg", "OMP_NUM_THREADS=1", "TIDY3D_MICROWAVE__SUPPRESS_RF_LICENSE_WARNING=true"]
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
norecursedirs = [
  "tests/_test_local",
  "tests/_integration",
  "tests/test_cli",
  "tests/_test_data",
  "tests/_test_notebooks",
  "tests/_test_tidy3d_extras",
  "tidy3d/web",
  "docs/faq",
]
filterwarnings = "ignore::DeprecationWarning"
testpaths = ["tidy3d", "tests", "docs"]
python_files = "*.py"

[tool.pyrefly]
project-includes = ["tidy3d"]
python-version = "3.10.0"
preset = "off"
ignore-missing-imports = ["*"]

[tool.pyrefly.errors]
implicit-any-parameter = "error"
unannotated-return = "error"
deprecated = "error"
redundant-cast = "error"
redundant-condition = "error"
invalid-literal = "error"
unnecessary-type-conversion = "error"
bad-raise = "error"
bad-keyword-argument = "error"
invalid-syntax = "error"
implicit-any-attribute = "error"
invalid-argument = "error"
implicitly-defined-attribute = "error"
bad-override-param-name = "error"
not-required-key-access = "error"
